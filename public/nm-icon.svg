<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="nmBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a2318"/>
      <stop offset="100%" stop-color="#14110d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3dc"/>
      <stop offset="35%" stop-color="#d4881f"/>
      <stop offset="70%" stop-color="#a06010"/>
      <stop offset="100%" stop-color="#efb04d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="url(#nmBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Sacred Mani Bead / Gem Motif -->
  <g transform="translate(256, 256) scale(1.6)" filter="url(#glow)">
    <!-- Central Diamond / Mani -->
    <path d="M 0 -70 L 60 0 L 0 70 L -60 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 0 -45 L 38 0 L 0 45 L -38 0 Z" fill="url(#goldGrad)" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
    
    <!-- Bead garland / facets -->
    <circle cx="0" cy="-95" r="9" fill="url(#goldGrad)"/>
    <circle cx="67" cy="-67" r="9" fill="url(#goldGrad)"/>
    <circle cx="95" cy="0" r="9" fill="url(#goldGrad)"/>
    <circle cx="67" cy="67" r="9" fill="url(#goldGrad)"/>
    <circle cx="0" cy="95" r="9" fill="url(#goldGrad)"/>
    <circle cx="-67" cy="67" r="9" fill="url(#goldGrad)"/>
    <circle cx="-95" cy="0" r="9" fill="url(#goldGrad)"/>
    <circle cx="-67" cy="-67" r="9" fill="url(#goldGrad)"/>
  </g>
</svg>
